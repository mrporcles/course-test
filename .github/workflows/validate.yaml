name: validate
run-name: Validate metadata on ${{ github.ref_name }}

on:
  pull_request:
    paths:
      - "metadata/**"
      - "scripts/**"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Check metadata
        run: make check
